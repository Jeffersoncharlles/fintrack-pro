name: Test services

on:
  push:
    paths:
      - 'apps/api-gateway/**'
      - 'apps/transaction-service/**'
      - 'apps/users-service/**'
      - 'apps/wallet-service/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
  pull_request:
    paths:
      - 'apps/api-gateway/**'
      - 'apps/transaction-service/**'
      - 'apps/users-service/**'
      - 'apps/wallet-service/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - transaction-service
          - users-service
          - wallet-service

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter ${{ matrix.service }} run --if-present test
